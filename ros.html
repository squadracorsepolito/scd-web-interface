<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Sito ROS 2</title>
</head>
<body>
    <div id="latency">Trasmettiamo a:</div>
    <div id="bandwidth">Trasmettiamo a:</div>
    <div id="message"></div>
    <h2>Messaggi ricevuti da ROS 2:</h2>
    <div id="output">In attesa di dati...</div>
    
    
    <script>

        var socket = new WebSocket("ws://127.0.0.1:9090");
        let timestamp = 0;
        let bandwidth = 0;
        let dataReceived = false; // Variabile per tracciare se sono arrivati dati


        socket.onopen = function() {
            console.log("WebSocket Open!");
        };

        socket.onerror = function(err) {
            console.log("WebSocket Error:", err);
        };

        socket.onmessage = function(msg) {
            // Mostra la risposta del WebSocket (dal nodo ROS) nel sito
            document.getElementById("output").innerText = "WebSocket answer: " + msg.data;
            const jsonData = JSON.parse(msg.data);
            timestamp = jsonData['timestamp'];
            bandwidth = jsonData['Ndata'];
            dataReceived = true;
        }

        setInterval(() => {

            if(dataReceived){
                document.getElementById("latency").innerText = (Date.now() - (timestamp* 1e3).toFixed(2)).toFixed(2) + " ms";
                document.getElementById("bandwidth").innerText = ((bandwidth*8/(Date.now()/1e3 - timestamp))/1e6).toFixed(2) + " Mbps";
            }
            else{
                document.getElementById("message").innerText = "Websocket closed";

            }
            dataReceived = false;
        }, 1000);


    </script>
</body>
</html>
