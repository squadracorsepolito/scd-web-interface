<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Sito ROS 2</title>
</head>
<body>
    <div id="latency">Trasmettiamo a:</div>
    <div id="data">dati a:</div>
    <div id="throughput">Trasmettiamo a:</div>
    <div id="message"></div>
    <h2>Messaggi ricevuti da ROS 2:</h2>
    <div id="output">In attesa di dati...</div>
    
    
    <script>

        var socket = new WebSocket("ws://127.0.0.1:9090");
        let latency = 0;
        let data_size = 0;
        let dataReceived = false; // Variabile per tracciare se sono arrivati dati


        socket.onopen = function() {
            console.log("WebSocket Open!");
        };

        socket.onerror = function(err) {
            console.log("WebSocket Error:", err);
        };

        socket.onmessage = function(msg) {
            // Mostra la risposta del WebSocket (dal nodo ROS) nel sito
            document.getElementById("output").innerText = "WebSocket answer: " + msg.data;
            const jsonData = JSON.parse(msg.data);
            latency = Date.now() - jsonData['timestamp'] ;
            data_size = jsonData['Ndata'] || 0;
            dataReceived = true;

            
            // message = {
            //     "time": Date.now()
            // };     
            // socket.send(JSON.stringify(message));
        }

        setInterval(() => {

            if(dataReceived){
                document.getElementById("latency").innerText = latency.toFixed(2) + " ms";
                // let throughput = latency > 0 ? ((data_size * 8 / latency) / 1e3).toFixed(2) : 0;
                document.getElementById("throughput").innerText = (((data_size*8)/(latency/1e3))/1e6).toFixed(2) + " Mbps";
                document.getElementById("data").innerText = data_size + " byte";

            }
            else{
                document.getElementById("message").innerText = "Websocket closed";

            }
            dataReceived = false;
        }, 1000);


    </script>
</body>
</html>
